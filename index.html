<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F2EA">
<title>汪格 WOOF-TI · 你是什么狗</title>
<style>
  :root{--paper:#F6F2EA;--card:#FFFDF8;--ink:#22211E;--ink2:#6B675E;--ink3:#9C978B;--line:#DCD5C8;--accent:#A6462B;--soft:#EFE8DB;}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-weight:400;-webkit-font-smoothing:antialiased}
  body{display:flex;justify-content:center;min-height:100vh}
  .wrap{width:100%;max-width:560px;padding:28px 22px 60px;position:relative}
  .serif{font-family:"Songti SC","Source Han Serif SC","Noto Serif SC",Georgia,serif;font-weight:600}
  h1{font-size:34px;letter-spacing:.02em;line-height:1.2}
  .sub{margin-top:10px;color:var(--ink2);font-size:14px;line-height:1.8}
  .meta{margin-top:22px;color:var(--ink3);font-size:12px;letter-spacing:.06em}
  .btn{display:flex;align-items:center;justify-content:center;width:100%;padding:16px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font-size:16px;font-weight:600;cursor:pointer;border-radius:2px;font-family:inherit;letter-spacing:.04em}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:transparent;color:var(--ink)}
  .actions{margin-top:26px;display:flex;flex-direction:column;gap:10px}
  .screen{display:none}.screen.on{display:block}
  /* quiz */
  .bar{height:3px;background:var(--soft);border-radius:2px;overflow:hidden;margin-bottom:8px}
  .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s ease}
  .qmeta{display:flex;justify-content:space-between;color:var(--ink3);font-size:12px;letter-spacing:.08em;margin-bottom:30px}
  .scene{font-size:19px;line-height:1.75;font-weight:500}
  .tag{margin-top:14px;color:var(--ink3);font-size:12px;letter-spacing:.1em}
  .opts{margin-top:28px;display:flex;flex-direction:column;gap:10px}
  .opt{text-align:left;padding:15px 16px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px;line-height:1.65;border-radius:2px;cursor:pointer;font-family:inherit;transition:border-color .15s,background .15s}
  .opt:active{background:var(--soft)}
  .opt.pick{border-color:var(--accent);background:#FBF2EE}
  .nav{margin-top:22px;display:flex;justify-content:space-between;align-items:center;color:var(--ink3);font-size:13px}
  .link{color:var(--ink2);text-decoration:none;cursor:pointer;border-bottom:1px solid var(--line)}
  /* result */
  .hero{margin-top:8px;text-align:center}
  .disc{width:84px;height:84px;border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:30px;font-weight:600}
  .rhero{display:block;width:min(230px,58vw);height:auto;margin:0 auto 20px;border:1px solid var(--line);background:#fff}
  #cover{display:flex;flex-direction:column;justify-content:center;min-height:76vh}
  .why{margin-top:30px;border-top:1px solid var(--line)}
  .why summary{padding:18px 0 4px;font-size:12px;letter-spacing:.12em;color:var(--ink3);cursor:pointer;list-style:none}
  .why summary::-webkit-details-marker{display:none}
  .why summary:after{content:' +';margin-left:6px}
  .why[open] summary:after{content:' −'}
  .why[open] summary{color:var(--ink2)}
  .why .block{border-top:0;padding-top:14px}
  .rname{font-size:32px;letter-spacing:.02em}
  .rline{margin-top:8px;color:var(--ink2);font-size:15px}
  .sim{margin-top:16px;display:inline-block;padding:6px 12px;border:1px solid var(--line);font-size:12px;color:var(--ink2);letter-spacing:.04em}
  .block{margin-top:34px;border-top:1px solid var(--line);padding-top:20px}
  .k{font-size:12px;letter-spacing:.14em;color:var(--ink3);margin-bottom:12px}
  .body{font-size:15px;line-height:1.85;color:var(--ink)}
  .risk{margin-top:12px;font-size:14px;line-height:1.75;color:var(--accent)}
  .tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .tg{font-size:12px;color:var(--ink2);border:1px solid var(--line);padding:3px 8px}
  .rolebox{margin-top:22px;padding:16px;background:var(--card);border:1px solid var(--line)}
  .rolebox b{font-size:15px}
  .rolebox p{margin-top:8px;font-size:14px;line-height:1.75;color:var(--ink2)}
  .dims{margin-top:8px;display:flex;flex-direction:column;gap:11px}
  .dim{display:grid;grid-template-columns:64px 1fr 52px;gap:10px;align-items:center}
  .dn{font-size:12px;color:var(--ink2)}
  .track{height:6px;background:var(--soft);position:relative;border-radius:3px;overflow:visible}
  .track:after{content:'';position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line)}
  .track i{position:absolute;top:0;bottom:0;left:50%;background:var(--accent);border-radius:3px}
  .dv{font-size:11px;color:var(--ink3);text-align:right;letter-spacing:.02em}
  .note{font-size:13px;line-height:1.8;color:var(--ink2);margin-top:10px}
  .note b{color:var(--accent);font-weight:600}
  .kc{margin-top:10px;padding:12px 0;border-bottom:1px solid var(--soft)}
  .kc .t{font-size:12px;color:var(--ink3)}
  .kc .o{font-size:14px;margin-top:4px;line-height:1.6}
  .kc .d{font-size:12px;color:var(--accent);margin-top:4px}
  .gcard{border-top:1px solid var(--line);padding:16px 0;display:flex;gap:14px;align-items:flex-start}
  .gcard img{width:78px;height:104px;object-fit:cover;border:1px solid var(--line);flex:0 0 auto}
  .gcard .gn{font-size:16px;font-weight:600}
  .gcard .gl{font-size:13px;color:var(--ink2);margin-top:4px}
  .foot{margin-top:40px;color:var(--ink3);font-size:11.5px;line-height:1.9}
  .banner{margin-top:16px;padding:12px 14px;background:#F3EDE1;border-left:3px solid var(--accent);font-size:13px;line-height:1.7;color:var(--ink2)}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>

<script>
const DATA = {"dims":{"anx":{"name":"关系焦虑","layer":"P","high":"对被否定敏感，需要反复确认","low":"笃定，不靠确认维持关系"},"avo":{"name":"关系回避","layer":"P","high":"暴露会不适，习惯自己消化","low":"能依赖也能被依赖"},"con":{"name":"尽责自律","layer":"P","high":"有计划、守承诺、按规则来","low":"随性，走一步看一步"},"exp":{"name":"外放表达","layer":"P","high":"情绪写在脸上，先说出来","low":"内敛，先在心里过一遍"},"agg":{"name":"宜人共情","layer":"P","high":"先想到对方，愿意让步","low":"先守住自己的立场"},"nov":{"name":"开放探索","layer":"P","high":"要新鲜感，愿意重来","low":"稳定可预期最舒服"},"exch":{"name":"交换取向","layer":"S","high":"关系讲对等与记账，按规则来","low":"关系优先，不算细账"},"pow":{"name":"权力位置","layer":"S","high":"在关系里能定规矩，不怕失去","low":"更依赖对方，怕关系破裂"},"face":{"name":"面子工夫","layer":"S","high":"在意评价，擅长场面管理","low":"不在乎别人怎么看"},"net":{"name":"网络嵌入","layer":"S","high":"关系网的中枢，乐于动员","low":"孤岛，少求人"}},"proto":{"golden":{"n":"金毛","anx":45,"avo":25,"con":85,"exp":45,"agg":92,"nov":35,"exch":25,"pow":40,"face":45,"net":55},"border":{"n":"边牧","anx":40,"avo":45,"con":95,"exp":30,"agg":35,"nov":85,"exch":65,"pow":70,"face":80,"net":85},"husky":{"n":"哈士奇","anx":20,"avo":60,"con":15,"exp":90,"agg":55,"nov":95,"exch":50,"pow":55,"face":15,"net":25},"poodle":{"n":"泰迪","anx":95,"avo":15,"con":40,"exp":85,"agg":85,"nov":45,"exch":35,"pow":30,"face":90,"net":60},"shiba":{"n":"柴犬","anx":20,"avo":95,"con":60,"exp":15,"agg":25,"nov":35,"exch":70,"pow":80,"face":75,"net":25},"corgi":{"n":"柯基","anx":55,"avo":30,"con":30,"exp":90,"agg":50,"nov":65,"exch":55,"pow":88,"face":85,"net":70},"samoyed":{"n":"萨摩耶","anx":20,"avo":15,"con":45,"exp":80,"agg":97,"nov":65,"exch":30,"pow":35,"face":85,"net":90},"shepherd":{"n":"德牧","anx":30,"avo":50,"con":80,"exp":20,"agg":80,"nov":30,"exch":40,"pow":95,"face":55,"net":45}},"items":[{"id":"Q01","tag":"借钱不还","target":"exch × face × pow","scene":"朋友半年前借了你三千，一直没提。今天你们又约了饭。","opts":[{"t":"饭桌上直接问：那笔钱你什么时候方便？","w":{"pow":3,"face":-2},"why":"把账摆上台面：高权力位置 + 低面子顾虑"},{"t":"不提。这顿之后，下次不再借","w":{"exch":2,"avo":1},"why":"用退出代替交涉：记账 + 回避冲突"},{"t":"找个由头说最近自己也紧","w":{"face":3,"agg":1},"why":"保全双方体面：迂回提示，不撕破脸"}]},{"id":"Q02","tag":"同事抢功","target":"pow × face × agg","scene":"会上，同事把你做的方案说成了他的。","opts":[{"t":"当场补细节，让在场的人自己判断","w":{"pow":3,"exp":1},"why":"公开夺回定义权：高主导 + 高表达"},{"t":"先谢他补充，再补一句\"细节我上周发你了\"","w":{"face":2,"pow":2},"why":"高面子 + 高权力：体面地把定义权拿回来"},{"t":"算了，领导心里有数","w":{"agg":2,"avo":2},"why":"认知重评式退让：把不争解释成体面"}]},{"id":"Q03","tag":"群里被点名","target":"face × exp × anx","scene":"工作群里，领导当众点名说你这次做得不行。","opts":[{"t":"立刻在群里解释清楚","w":{"face":3,"exp":2,"anx":1},"why":"当众修复形象：面子驱动 + 高唤醒"},{"t":"先不回，私下找领导问清楚","w":{"avo":2,"pow":1},"why":"把公开场转成私下场：回避 + 保住位置"},{"t":"先认下来，回头再说","w":{"agg":2,"con":2},"why":"低冲突策略：责任优先，情绪延后"}]},{"id":"Q04","tag":"父母与伴侣","target":"pow × face × avo","scene":"父母和伴侣因为一件小事在你面前吵起来了。","opts":[{"t":"站伴侣，回头跟父母把界限划清","w":{"pow":2,"con":1,"agg":-2},"why":"明确站队：高权力 + 低宜人"},{"t":"两头哄，先让场面过去","w":{"face":3,"agg":2},"why":"场面管理：面子的典型操作"},{"t":"起身走开，等他们自己停","w":{"avo":3},"why":"情绪撤离：回避型应对"}]},{"id":"Q05","tag":"份子钱","target":"exch × face × net","scene":"一个只见过几面的同事结婚，给你发了请帖。","opts":[{"t":"按行情给，不多不少","w":{"exch":3,"con":1},"why":"对等交换：按共同体的行情定价"},{"t":"多给一点，留个好印象","w":{"face":2,"net":3},"why":"人情投资：送礼是网络维护"},{"t":"找个理由不去，也不随","w":{"avo":2,"net":-1,"anx":1},"why":"退出关系场：削减无效义务"}]},{"id":"Q06","tag":"同学会","target":"face × exp × net","scene":"同学会上，混得最好的人一直在讲自己的近况。","opts":[{"t":"跟着捧，场面热络最要紧","w":{"face":2,"net":2,"agg":1,"anx":1},"why":"关系维护：给面子＝给网络续费"},{"t":"找机会也讲讲自己","w":{"exp":2,"pow":2,"face":2},"why":"争夺注意力：自我呈现的竞争面"},{"t":"坐一会儿就走","w":{"avo":2,"exp":-1},"why":"低卷入：不参与地位竞赛"}]},{"id":"Q07","tag":"被当成理所当然","target":"exch × pow × agg","scene":"你一直帮的忙，对方已经当成理所当然了。","opts":[{"t":"说清楚：我可以帮，但这不是应该的","w":{"pow":3,"con":2},"why":"重定契约：把人情拉回对等"},{"t":"下次装忙，能不帮就不帮","w":{"exch":2,"face":2},"why":"被动撤退：不撕破脸地减少投入"},{"t":"继续帮，心里记着","w":{"agg":3,"con":1},"why":"共同体逻辑：关系高于对等"}]},{"id":"Q08","tag":"陌生人求助","target":"agg × anx × con","scene":"地铁上有人突然蹲下，看起来很难受，周围没人动。","opts":[{"t":"先过去扶，同时喊人帮忙","w":{"agg":2,"pow":2},"why":"主动承担：宜人 + 主导的组合"},{"t":"看别人动不动，再决定","w":{"anx":2,"face":1,"pow":-1},"wh const CALIB = (function(){
  const out = {};
  for (const k of KEYS) {
    let mean = 0, scale = 0;
    for (const it of ITEMS) {
      const ws = it.opts.map(function(o){ return o.w[k] || 0; });
      const m = ws.reduce(function(a,b){ return a+b; }, 0) / ws.length;
      mean += m;
      scale += Math.max.apply(null, ws.map(function(w){ return Math.abs(w-m); }));

  }

})();
function zs(v){ const m = v.reduce(function(a,b){return a+b;},0)/v.length; const s = Math.sqrt(v.reduce(function(a,b){return a+(b-m)*(b-m);},0)/v.length) || 1; return v.map(function(x){return (x-m)/s;}); }
function pearson(a,b){ const za = zs(a), zb = zs(b); let s = 0; for (let i=0;i<a.length;i++) s += za[i]*zb[i]; return s/a.length; }

function halfVec(parity){
  const items = ITEMS.map(function(_,i){ return i; }).filter(function(i){ return i%2===parity; });
  const raw = {}; KEYS.forEach(function(k){ raw[k]=0; });

      mean += m;
      scale += Math.max.apply(null, ws.map(function(w){ return Math.abs(w-m); }));

function compute(){

  if (p && e) return '权力感与交换取向都靠近中线';
  if (p) return '权力位置落在中线附近（你既不像能定规矩的人，也不像被安排的人）';
  return '交换取向落在中线附近（你既不像记账的人，也不像不算账的人）';
}
function contrib(s, protoId){
  const target = KEYS.map(function(k){ return PROTO[protoId][k]; });
  const baseR = pearson(s.vec, target);
  const out = [];
  ITEMS.forEach(function(it,qi){
    const chosen = it.opts[answers[qi]];
    const avg = KEYS.map(function(k){ let t=0; it.opts.forEach(function(o){ t += (o.w[k]||0); }); return t/3; });
    const alt = s.vec.map(function(v,i){ return v - (chosen.w[KEYS[i]]||0) + avg[i]; });
    out.push({ qi:qi, delta: baseR - pearson(alt, target) });
  });
  out.sort(function(a,b){ return Math.abs(b.delta)-Math.abs(a.delta); });
  return out.slice(0,3);
}

/* ---------- 交互 ---------- */
function show(id){ Array.prototype.forEach.call(document.querySelectorAll('.screen'), function(s){ s.classList.remove('on'); }); document.getElementById(id).classList.add('on'); window.scrollTo(0,0); }
function shuffle(a){ const b=a.slice(); for (let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=b[i]; b[i]=b[j]; b[j]=t; } return b; }

function cover(){
  app.innerHTML = '<section class="screen on" id="cover">'
    + '<h1 class="serif">汪格 <span style="font-size:15px;letter-spacing:.2em;color:var(--ink3)">WOOF-TI</span></h1>'
    + '<p class="sub">四十七个情景，一个答案。<br>测完，你就知道你是什么狗。</p>'
    + '<p class="meta">约 3 分钟 · 答案不出端</p>'
    + '<div class="actions"><button class="btn" id="startBtn">开始</button></div>'
    + '<div class="foot">仅供娱乐与自我觉察，不构成心理诊断。</div>'
    + '</section>';
  document.getElementById('startBtn').onclick = startTest;
}

function startTest(){
  answers = new Array(ITEMS.length).fill(null);
  order = ITEMS.map(function(){ return shuffle([0,1,2]); });
  idx = 0;
  log = { v: DATA.version, sid: Date.now().toString(36), t0: Date.now(), last: Date.now(), items: [] };
  renderQ();
}
function renderQ(){
  const it = ITEMS[idx], ord = order[idx];
  app.innerHTML = '<section class="screen on" id="quiz">'
    + '<div class="bar"><i style="width:' + Math.round((idx)/ITEMS.length*100) + '%"></i></div>'
    + '<div class="qmeta"><span>' + (idx+1) + ' / ' + ITEMS.length + '</span><span>' + it.tag + '</span></div>'
    + '<div class="scene">' + it.scene + '</div>'
    + '<div class="opts">' + ord.map(function(oi, i){
        return '<button class="opt" data-oi="' + oi + '">' + it.opts[oi].t + '</button>';
      }).join('') + '</div>'
    + '<div class="nav"><span class="link" id="back">' + (idx>0?'← 上一题':'') + '</span><span style="color:var(--ink3)">' + Math.round((ITEMS.length-idx)*3.5/60) + ' 分钟</span></div>'
    + '</section>';
  Array.prototype.forEach.call(document.querySelectorAll('.opt'), function(b){
    if (answers[idx] !== null && parseInt(b.getAttribute('data-oi'),10) === answers[idx]) b.classList.add('pick');
    b.onclick = function(){ pick(parseInt(b.getAttribute('data-oi'),10)); };
  });
  const back = document.getElementById('back');
  if (back) back.onclick = function(){ if (idx>0){ idx--; renderQ(); } };
}
function pick(oi){
  answers[idx] = oi;
  if (log) {
    const now = Date.now();
    log.items.push({ qid: ITEMS[idx].id, tag: ITEMS[idx].tag, opt: oi, pos: order[idx].indexOf(oi), order: order[idx].slice(), ms: now - log.last, ts: now });
    log.last = now;
  }
  if (idx < ITEMS.length-1) { idx++; setTimeout(renderQ, 90); }
  else setTimeout(result, 120);
}

function result(){
  const s = compute();
  const top = s.ranked[0], second = s.ranked[1];
  const t = TEXTS[top.id];
  const tie = s.margin < 0.03;
  const role = roleOf(s.norm);
  const ks = contrib(s, top.id);
  const pct = Math.round(Math.max(0, top.r) * 100);
  const pct2 = Math.round(Math.max(0, second.r) * 100);
  const lowConf = s.conf < 45;
  try {
    persist({ v: DATA.version, sid: (log && log.sid) || 'demo', at: new Date().toISOString(), t0: (log && log.t0) || Date.now(), dog: top.id, dogName: top.name, role: role, conf: s.conf, items: (log && log.items) || [] });
  } catch (e) {}

  const dimRows = KEYS.map(function(k){
    const v = s.norm[k], d = v-50, w = Math.abs(d);
    const left = d>=0 ? '50%' : (50-w/2) + '%';
    const f = RULES.flags[k];
    const base = v>=65 ? '偏强' : v<=35 ? '偏弱' : '居中';
    const tag = f && f.mode === 'silent' ? '—' : (f && f.mode === 'reference' ? base + '·参考' : base);
    return '<div class="dim"><span class="dn">' + DIMS[k].name + '</span>'
      + '<span class="track"><i style="left:' + left + ';width:' + (w/2) + '%"></i></span>'
      + '<span class="dv">' + tag + '</span></div>';
  }).join('');

  // 规则一：高相关配对从审计结果生成，不单独叙事
  const PAIRS = RULES.pairs.map(function(p){ return [p.a, p.b, p.r]; });
  const MINDEV = RULES.thresholds.pairMinDev;
  const notes = PAIRS.filter(function(p){
    return Math.abs(s.norm[p[0]]-50) >= MINDEV && Math.abs(s.norm[p[1]]-50) >= MINDEV;
  }).slice(0,2);
  const silentDims = KEYS.filter(function(k){ return RULES.flags[k] && RULES.flags[k].mode === 'silent'; });
  const refDims = KEYS.filter(function(k){ return RULES.flags[k] && RULES.flags[k].mode === 'reference'; });
  const weakNote = (silentDims.length
      ? '「' + silentDims.map(function(k){ return DIMS[k].name; }).join('」「') + '」内部一致性不足（仿真上界 α '
        + Math.min.apply(null, silentDims.map(function(k){ return RULES.flags[k].alpha30; })).toFixed(2) + '–'
        + Math.max.apply(null, silentDims.map(function(k){ return RULES.flags[k].alpha30; })).toFixed(2) + '），只画条、不给方向；'
      : '')
    + (refDims.length
      ? '「' + refDims.map(function(k){ return DIMS[k].name; }).join('」「') + '」的估计追真值偏弱（r≈'
        + Math.min.apply(null, refDims.map(function(k){ return RULES.flags[k].rTrue; })).toFixed(2) + '–'
        + Math.max.apply(null, refDims.map(function(k){ return RULES.flags[k].rTrue; })).toFixed(2) + '），标了「参考」。'
      : '')
    + (silentDims.length || refDims.length ? '以上数字均为仿真上界，真实作答只会更低。' : '');

  app.innerHTML = '<section class="screen on" id="result">'
    + (lowConf ? '<div class="banner">这份作答前后一致性偏低（' + s.conf + '/100），结果仅供参考。建议隔一会儿重测一次，或者换个心情再来。</div>' : '')
    + '<div class="hero"><img class="rhero" src="' + IMG[top.id].hero + '" alt="' + top.name + '" width="720" height="960">'
    + '<div class="rname serif">' + top.name + (tie ? ' × ' + second.name : '') + '</div>'
    + '<div class="rline">' + t.line + '</div>'
    + '<div class="sim">' + (tie
        ? '与 ' + top.name + ' / ' + second.name + ' 的剖面相似度都在 ' + pct + '% 上下'
        : '与 ' + top.name + ' 的剖面相似度 ' + pct + '%｜次位 ' + second.name + ' ' + pct2 + '%') + '</div></div>'
    + '<div class="tags">' + t.tags.map(function(x){ return '<span class="tg">' + x + '</span>'; }).join('') + '</div>'
    + '<div class="block"><div class="body">' + t.body + '</div><div class="risk">注意：' + t.risk + '</div></div>'
    + (role ? '<div class="rolebox"><b>关系角色 · ' + ROLES[role].name + '</b><p>' + ROLES[role].text + '</p>'
        + '<p style="font-size:12px;color:var(--ink3);margin-top:10px">角色看的是你现在的结构位置（权力 × 交换），不是性格。换一段关系，它可能就变。</p></div>'
      : '<div class="rolebox"><b>关系角色 · 位置模糊</b><p>' + roleWhy(s.norm) + '，象限归属等于掷硬币——所以我们不给标签。</p></div>')
    + '<details class="why"><summary>展开：这结果是怎么算出来的</summary>'
    + '<div class="block"><div class="k">十维剖面</div><div class="dims">' + dimRows + '</div>'
    + (notes.length ? '<p class="note">' + notes.map(function(p){
        return '「' + DIMS[p[0]].name + '」和「' + DIMS[p[1]].name + '」在题库里高度共变（r≈' + p[2].toFixed(2) + '），你看到的很可能是<b>同一件事被记了两次账</b>，别当成两条独立结论。';
      }).join('<br>') + '</p>' : '')
    + (weakNote ? '<p class="note">' + weakNote + '。以上 α 是仿真上界，真实作答只会更低。</p></div>' : '</div>')
    + '<div class="block"><div class="k">这三题把你推向了 ' + top.name + '</div>'
    + ks.map(function(k){
        const it = ITEMS[k.qi];
        return '<div class="kc"><div class="t">' + it.tag + '｜' + it.scene.slice(0, 26) + '…</div>'
          + '<div class="o">' + it.opts[answers[k.qi]].t + '</div>'
          + '<div class="d">这一题把你的结果' + (k.delta>0 ? '拉向 ' : '拉离 ') + top.name + ' ' + Math.abs(k.delta*100).toFixed(0) + ' 分相似度</div></div>';
      }).join('') + '</div>'
    + '</details>'
    + '<div class="actions"><button class="btn" id="shareBtn">复制结果链接</button>'
    + '<button class="btn ghost" id="againBtn">再测一次</button>'
    + '<button class="btn ghost" id="galBtn">看八只狗</button>'
    + '<button class="btn ghost" id="aboutBtn2">这个结果有多可信</button>'
    + '<button class="btn ghost" id="exportBtn2">导出我的作答（CSV）</button></div>'
    + '<div class="foot">娱乐与自我觉察用途，不构成心理诊断。本版本没有服务端：作答只存在你这台设备上，不上传。</div>'
    + '</section>';

  document.getElementById('shareBtn').onclick = function(){
    const url = location.href.split('?')[0] + '?r=' + top.id + (role ? '&ro=' + role : '');
    const txt = '我测出来是「' + top.name + ' · ' + t.line + '」' + (role ? '，关系角色是' + ROLES[role].name : '') + '，你也来测测：' + url;
    if (navigator.share) { navigator.share({ title:'汪格 WOOF-TI', text:txt, url:url }).catch(function(){}); return; }
    navigator.clipboard.writeText(txt).then(function(){ alert('已复制，去粘贴给朋友吧'); }).catch(function(){ prompt('复制这个链接：', url); });
  };
  document.getElementById('againBtn').onclick = startTest;
  document.getElementById('galBtn').onclick = gallery;
  document.getElementById('aboutBtn2').onclick = about;
  document.getElementById('exportBtn2').onclick = exportCSV;
}

function gallery(){
  app.innerHTML = '<section class="screen on" id="gallery"><h1 class="serif" style="font-size:24px">八只狗</h1>'
    + '<p class="sub">它们不是八个"标准答案"，是八种维持关系的方式。</p>'
    + Object.keys(PROTO).map(function(id){
        const t = TEXTS[id];
        return '<div class="gcard"><img src="' + IMG[id].thumb + '" alt="' + PROTO[id].n + '" width="320" height="427" loading="lazy">'
          + '<div><div class="gn">' + PROTO[id].n + ' · ' + t.line + '</div>'
          + '<div class="gl">' + t.tags.join(' / ') + '</div></div></div>';
      }).join('')
    + '<div class="actions"><button class="btn ghost" id="backCover">返回</button></div></section>';
  document.getElementById('backCover').onclick = (answers.length && answers[0]!==null) ? result : cover;
}

function about(){
  const weakest = KEYS.filter(function(k){ return RULES.flags[k]; })
    .map(function(k){ return DIMS[k].name + '（' + (RULES.flags[k].mode === 'silent' ? 'α≈' + RULES.flags[k].alpha30 : 'r≈' + RULES.flags[k].rTrue) + '）'; }).join('、');
  const topPair = RULES.pairs[0];
  app.innerHTML = '<section class="screen on" id="about"><h1 class="serif" style="font-size:24px">这个测试有多可信</h1>'
    + '<p class="sub">我们不打算说"99.6% 准"。那是个内部校验数字，不是准确率。</p>'
    + '<div class="block"><div class="k">三条我们真正守住的线</div>'
    + '<p class="note">① <b>瞎选的人不会被告知"高置信"</b>：随机作答被判高置信的比例约 12%，与掷骰子基线持平。<br>'
    + '② <b>一路点同一个位置没用</b>：每题选项顺序随机，直线作答会被打散。<br>'
    + '③ <b>不确定时就承认不确定</b>：两型分数接近给双主型；任一轴贴中线时不给关系角色；整份作答一致性偏低时会提示重测。</p></div>'
    + '<div class="block"><div class="k">已知的短板</div>'
    + '<p class="note">' + (topPair ? '十维里有几对在题库中高度共变（最突出的是' + DIMS[topPair.a].name + '与' + DIMS[topPair.b].name + '，r≈' + topPair.r.toFixed(2) + '），所以"权力高 + 宜人低"可能是一件事被记了两次账。<br>' : '')
    + (weakest ? '标注降级的维度：' + weakest + '。silent 的只画条、不给方向；reference 的标签加「·参考」。<br>' : '')
    + '关系角色用的"权力"一列，目前测的是自我感知的位置，不是客观结构——这一点会在下一代用人内对比题修。</p></div>'
    + '<div class="block"><div class="k">你的作答数据</div>'
    + '<p class="note">全部存在本机（localStorage），不上传。你可以随时导出一份 CSV，用来自己核对，或在你参加试测时交回给发起人。题库版本戳：<b>' + DATA.version + '</b>。</p></div>'
    + '<div class="actions"><button class="btn ghost" id="exportBtn">导出我的作答（CSV）</button>'
    + '<button class="btn ghost" id="back2">返回</button></div></section>';
  document.getElementById('back2').onclick = (answers.length && answers[0]!==null) ? result : cover;
  document.getElementById('exportBtn').onclick = exportCSV;
}

/* ---------- 本地记录 + CSV 导出 ---------- */
const LS_KEY = 'wangti.runs';
function persist(run){
  try {
    const arr = JSON.parse(localStorage.getItem(LS_KEY) || '[]');
    arr.push(run);
    localStorage.setItem(LS_KEY, JSON.stringify(arr.slice(-60)));
  } catch (e) {}
}
function exportCSV(){
  let runs = [];
  try { runs = JSON.parse(localStorage.getItem(LS_KEY) || '[]'); } catch (e) {}
  if (!runs.length) { alert('本机还没有作答记录。先测一次再来导出。'); return; }
  const head = ['version','session','finished_at','item_id','item_tag','option_index','option_position','order','ms','since_start_ms'];
  const rows = [head.join(',')];
  runs.forEach(function(run){
    run.items.forEach(function(it, i){
      rows.push([run.v, run.sid, run.at, it.qid, '"' + (it.tag || '') + '"', it.opt, it.pos, (it.order||[]).join('|'), it.ms, it.ts - run.t0].join(','));
    });
  });
  const blob = new Blob(['\ufeff' + rows.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'wangti-' + DATA.version + '-' + Date.now() + '.csv';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ---------- 好友视角 / 调试入口 ---------- */
function friendView(dogId, roleKey){
  if (!PROTO[dogId]) return false;
  const t = TEXTS[dogId];
  app.innerHTML = '<section class="screen on"><div class="banner">这是你朋友的结果。你也测一个，看看是不是同一窝。</div>'
    + '<div class="hero" style="margin-top:24px"><img class="rhero" src="' + IMG[dogId].hero + '" alt="' + PROTO[dogId].n + '" width="720" height="960">'
    + '<div class="rname serif">' + PROTO[dogId].n + '</div><div class="rline">' + t.line + '</div></div>'
    + '<div class="tags" style="justify-content:center">' + t.tags.map(function(x){ return '<span class="tg">' + x + '</span>'; }).join('') + '</div>'
    + '<div class="block"><div class="body">' + t.body + '</div></div>'
    + (roleKey && ROLES[roleKey] ? '<div class="rolebox"><b>关系角色 · ' + ROLES[roleKey].name + '</b><p>' + ROLES[roleKey].text + '</p></div>' : '')
    + '<div class="actions"><button class="btn" id="meToo">我也测</button></div></section>';
  document.getElementById('meToo').onclick = function(){ location.href = location.pathname; };
  return true;
}

(function init(){
  const q = new URLSearchParams(location.search);
  if (q.get('r') && friendView(q.get('r'), q.get('ro'))) return;
  if (q.get('p') === 'about') { about(); return; }
  if (q.get('p') === 'gallery') { gallery(); return; }
  if (q.get('q')) { startTest(); idx = Math.min(ITEMS.length-1, Math.max(0, parseInt(q.get('q'),10)||0)); renderQ(); return; }
  if (q.get('a')) {
    const arr = q.get('a').split(',').map(function(x){ return parseInt(x,10)||0; });
    startTest();
    answers = ITEMS.map(function(_,i){ return (arr[i] !== undefined ? arr[i] : 0) % 3; });
    result(); return;
  }
  cover();
})();
</script>
